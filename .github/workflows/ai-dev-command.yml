name: AI Dev Command - Patch Only

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Existing non-production branch name or refs/heads/branch; no tags or commit expressions."
        required: true
        type: string
      task:
        description: "Describe the smallest code change to prepare"
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate_patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate existing non-production branch name
        id: source
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          case "$SOURCE_REF" in
            refs/heads/*) branch="${SOURCE_REF#refs/heads/}" ;;
            refs/*) echo "Only branch refs are accepted" >&2; exit 1 ;;
            *) branch="$SOURCE_REF" ;;
          esac
          case "${branch,,}" in
            main|master|'') echo "Production/default branch is forbidden" >&2; exit 1 ;;
          esac
          git check-ref-format "refs/heads/$branch"
          echo "ref=refs/heads/$branch" >> "$GITHUB_OUTPUT"

      - name: Checkout existing branch without saved credentials
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Snapshot and run static guard before editing
        shell: bash
        run: |
          cp scripts/main-control-guard.js "$RUNNER_TEMP/main-control-guard.js"
          cp main-control/baseline.json "$RUNNER_TEMP/main-control-baseline.json"
          node "$RUNNER_TEMP/main-control-guard.js" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/main-control-baseline.json"

      - name: Generate working-tree edits only
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          prompt: |
            Read AGENTS.md first and follow it. Read MAIN_CONTROL.md and main-control/baseline.json.
            Task: ${{ inputs.task }}
            Make only the smallest requested working-tree edits.
            Preserve storage schemas, keys, session registration/exclusions, restore policy,
            persistence functions, NFC behavior and current ODsay host handling.
            Do not modify control/guard/workflow files or weaken validation.
            Do not create branches, commit, publish, open PRs, merge, deploy, promote,
            change domains, or change secrets/environment variables.
            Leave edits in the working tree only. Static checks are not browser QA.

      - name: Check original guard and control files after editing
        shell: bash
        run: |
          node "$RUNNER_TEMP/main-control-guard.js" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/main-control-baseline.json"
          git add -N .
          git diff --exit-code HEAD -- AGENTS.md MAIN_CONTROL.md main-control scripts/main-control-guard.js .github/workflows

      - name: Generate binary-safe patch outside repository
        id: diff
        shell: bash
        run: |
          git add -N .
          git diff --binary HEAD > "$RUNNER_TEMP/codex.patch"
          if [ -s "$RUNNER_TEMP/codex.patch" ]; then
            echo "has_patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install existing QA dependencies
        if: steps.diff.outputs.has_patch == 'true'
        run: npm install --no-package-lock

      - name: Install Playwright Chromium
        if: steps.diff.outputs.has_patch == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run existing mobile smoke
        if: steps.diff.outputs.has_patch == 'true'
        run: npm run qa:smoke

      - name: Upload validated patch artifact only
        if: success() && steps.diff.outputs.has_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codex-main-control-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/codex.patch
          if-no-files-found: error
          retention-days: 3
