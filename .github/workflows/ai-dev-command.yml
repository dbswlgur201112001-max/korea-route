name: AI Dev Command

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Describe the code change you want Codex to make"
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate_patch:
    name: Generate Codex patch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_patch: ${{ steps.diff.outputs.has_patch }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          prompt: |
            You are working in the KOREA ROUTE repository.

            First, read AGENTS.md and follow it exactly.

            User task:
            ${{ inputs.task }}

            Rules:
            - Make the smallest change necessary for the requested task.
            - Do not modify unrelated code.
            - Do not commit, push, open a pull request, merge, or deploy.
            - Never write secrets or API keys into the repository.
            - Do not change production/main directly; only edit the checked-out working tree.
            - Preserve existing storage keys and data structures unless the task explicitly requires otherwise.
            - Respect all restrictions in AGENTS.md.
            - When finished, leave the requested code changes in the working tree.

      - name: Create patch artifact
        id: diff
        shell: bash
        run: |
          git add -N .
          git diff --binary HEAD > codex.patch

          if [ -s codex.patch ]; then
            echo "has_patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload patch artifact
        if: steps.diff.outputs.has_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codex-task-patch-${{ github.run_id }}
          path: codex.patch
          if-no-files-found: error
          retention-days: 3

  open_pr:
    name: Open review PR
    runs-on: ubuntu-latest
    needs: generate_patch
    if: needs.generate_patch.outputs.has_patch == 'true'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Download Codex patch
        uses: actions/download-artifact@v4
        with:
          name: codex-task-patch-${{ github.run_id }}

      - name: Apply patch
        run: git apply --index codex.patch

      - name: Commit and push review branch
        id: branch
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          branch="codex/ai-task-$RUN_ID"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$branch"
          git commit -m "chore(ai): automated task $RUN_ID"
          git push origin "$branch"

          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ inputs.task }}
          BRANCH: ${{ steps.branch.outputs.name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo "## AI task"
            echo
            printf '%s\n' "$TASK"
            echo
            echo "## Automation"
            echo
            echo "- Generated by the official OpenAI Codex GitHub Action."
            echo "- Changes are on a review branch only."
            echo "- Existing PR checks, including QA Smoke and Vercel Preview, should run before merge."
            echo "- Production merge still requires approval."
          } > pr-body.md

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "AI task $RUN_ID" \
            --body-file pr-body.md
